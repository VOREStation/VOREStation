author: "ReoDaProtovali"
delete-after: True
changes:
  - rscadd: "Added a trap to the trap when you try to modify a spring trap without first disarming it"
  - rscadd: "Turbo spring traps which are 3 times faster at resetting"
  - rscadd: "custom subtype for mappers to fuck with, without creating invalid item states."
  - rscadd: "Added the ability to disassemble traps back into their base components"
  - rscdel: "Removed the crafting UI recipe for the auto-resetting trap. Just shove a motor into an existing trap now."
  - qol: "Upgrading traps is easier, as stated above. Hints to this is added to the description of the assembly kits."
  - bugfix: "fixes resetting sometimes occurring multiple times when resetting an automatic trap manually."
  - bugfix: "fixes icon state being incorrect when building a new trap"
  - sound: "changed the sound on springtrap trigger to metal_close.ogg"
  - code_imp: "defines now exist to allow easy mass-changing of springtrap reset times."
  - admin: "Springtraps now only log for launching ckey'ed mobs, and log for all of them, instead of only the initial victim (multiple could be launched from a single trigger)"
  - admin: "adminbus subtype is a bit faster. For bussin' purposes."