author: "Willburd"
delete-after: True
changes:
  - bugfix: "Fires no longer runtime when put out by fire extinguisher"
  - bugfix: "AIs updating single AI displays now properly update the image on them"
  - bugfix: "MMIs no longer cause a runtime when you use jumpercables on a FBP"
  - bugfix: "Tape recorder no longer runtimes when the tape is removed during recording"
  - bugfix: "Translocators with fixed destinations now properly build the destination selection menu when first used"
  - bugfix: "Invisible trash \"item\" removed from random junk spawns"
  - bugfix: "Simple doors now have the same delay before they can be closed when bumped, as they do when clicked open"
  - bugfix: "Carp swarm event now has proper announcement voice line"
  - bugfix: "Singulos no longer consume bluespace cascade walls"
  - bugfix: "slimes no longer spam messages when splashed by showers"
  - spellcheck: "\"clamping bleders\" type fixed"
  - qol: "Event managers can attack_hand buttons without runtimes"
  - balance: "wirecutters now work as an auxiliary tool for clamping bleeders"
  - balance: "Zaddat can no longer take photosensitivity and photodegeneration traits, due to already having them inately"
  - balance: "Lick wounds now works while weakened"
  - refactor: "ancient and unused transport pod entirely recoded for future event use"