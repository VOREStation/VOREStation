author: "Will"
delete-after: True
changes:
  - bugfix: "incorrect year calculation being used in ATM accounts"
  - qol: "Point defense turrets support mapper placed upgrades"
  - bugfix: "escaped slimes event now checks if a vent is welded before spawning a slime"
  - bugfix: "borgs are no longer kicked off of the rotary generators as soon as they get on"
  - bugfix: "multiple loc atoms no longer teleport upward when moved by shuttle"
  - balance: "Zaddat light burn intensity curve tweaked for more clear difference between low light and full light"
  - bugfix: "Fingerprints no longer change if a character respawns or is ahealed"
  - qol: "airlocks show if they are welded when examined"